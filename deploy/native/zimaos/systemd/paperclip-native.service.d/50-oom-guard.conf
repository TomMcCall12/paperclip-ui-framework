# Installed by paperclip-update.sh (TOM-686). Starts the OOM guard with the
# server: it protects the server's main process and embedded Postgres
# (oom_score_adj -500) and keeps every agent run it forks at >= 0, so agent
# runs are never more protected than Tailscale and networking (both 0).
# OOMScoreAdjust= is deliberately not set here: it applies to every process
# of the unit, agent runs included.
[Unit]
Wants=paperclip-native-oom-guard.service
